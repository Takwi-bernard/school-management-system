name: school_management_system
description: Multi-tenant school management platform.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.5.6
  go_router: ^14.2.0
  visibility_detector: ^0.4.0+2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  excel: ^4.0.6
  pdf: ^3.10.7
  printing: ^5.11.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image: ^4.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/school_management_icon.png"

  web:
    generate: true
    image_path: "assets/icon/school_management_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1A73E8"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/school_management_icon.png